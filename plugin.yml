name: CommunityGoal
version: 1.1.0
main: dev.domin8r.communitygoal.CommunityGoalPlugin
api-version: '26.1'
description: Server-wide community goal with a boss bar and contribution-based rewards.
author: Krishna
commands:
  communitygoal:
    description: Show the current community goal
    usage: /communitygoal [progress|top]
    aliases: [goal, cgoal]
  reward:
    description: Claim your community goal reward
    usage: /reward
permissions:
  communitygoal.admin:
    description: Reload, skip and add progress
    default: op
